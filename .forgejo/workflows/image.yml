name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: railway-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Forgejo registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN" || { echo "Missing REGISTRY_TOKEN secret" >&2; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | docker login forgejo.unicorn-tailor.ts.net -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and publish
        run: |
          image=forgejo.unicorn-tailor.ts.net/lawrencegripper/actions-builds-on-railway-sandbox
          docker build -t "$image:${{ github.sha }}" -t "$image:latest" .
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
